<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#f6f4ec" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0c0f0e" media="(prefers-color-scheme: dark)"></head><body>

<style>
/* Layout: one narrow column built for a phone. Today first, then fixed lessons, subjects, full calendar. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#14202b; --ink2:#566475; --line:#d9e0e8;
  --accent:#0a6c7e; --accent-soft:#dff0f3; --on-accent:#ffffff;
  --backlog:#a4510a; --backlog-soft:#fbe9d8;
  --new:#1b5fb8; --new-soft:#dde9fa;
  --rev:#566475; --rev-soft:#e6eaef;
  --fin:#6a3fa0; --fin-soft:#ece3f7;
  --c-math:#1b5fb8; --c-arabic:#1c7a4a; --c-english:#7b3fb0; --c-science:#0a7287; --c-history:#a4510a; --c-all:#566475;
  --font-d:"Cairo","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-b:"IBM Plex Sans Arabic","Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#161f27; --ink:#e7edf3; --ink2:#9aa8b6; --line:#27343f;
    --accent:#52b5c6; --accent-soft:#143741; --on-accent:#06242b;
    --backlog:#f0a35e; --backlog-soft:#3a2713;
    --new:#7fb0f2; --new-soft:#15293f;
    --rev:#9aa8b6; --rev-soft:#222d37;
    --fin:#c3a2ec; --fin-soft:#2a1f3c;
    --c-math:#7fb0f2; --c-arabic:#6fd09a; --c-english:#c3a2ec; --c-science:#52b5c6; --c-history:#f0a35e; --c-all:#9aa8b6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161f27; --ink:#e7edf3; --ink2:#9aa8b6; --line:#27343f;
  --accent:#52b5c6; --accent-soft:#143741; --on-accent:#06242b;
  --backlog:#f0a35e; --backlog-soft:#3a2713;
  --new:#7fb0f2; --new-soft:#15293f;
  --rev:#9aa8b6; --rev-soft:#222d37;
  --fin:#c3a2ec; --fin-soft:#2a1f3c;
  --c-math:#7fb0f2; --c-arabic:#6fd09a; --c-english:#c3a2ec; --c-science:#52b5c6; --c-history:#f0a35e; --c-all:#9aa8b6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:700}
.muted{color:var(--ink2)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 small{font:500 13px var(--font-b);color:var(--ink2)}

/* header */
.head{display:flex;flex-direction:column;gap:12px}
.head-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.count{font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--accent);white-space:nowrap}
.count b{font-size:30px;line-height:1;margin-inline-end:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar-note{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* day card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.day{padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day-h h3{font-size:19px;font-weight:800}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.fixed{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.fixed b{color:var(--ink);font-weight:600}
.slot{display:flex;flex-direction:column}
.slot-t{font:600 12px var(--font-b);letter-spacing:.04em;color:var(--ink2);font-variant-numeric:tabular-nums;padding:4px 0}
.brk{font-size:12px;color:var(--ink2);text-align:center;padding:4px 0}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.task-b{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.task-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.subj{font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.subj::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c-all)}
.s-math::before{background:var(--c-math)}.s-arabic::before{background:var(--c-arabic)}.s-english::before{background:var(--c-english)}
.s-science::before{background:var(--c-science)}.s-history::before{background:var(--c-history)}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.k-backlog{background:var(--backlog-soft);color:var(--backlog)}
.k-new{background:var(--new-soft);color:var(--new)}
.k-review{background:var(--rev-soft);color:var(--rev)}
.k-course{background:var(--accent-soft);color:var(--accent)}
.k-optional{background:var(--rev-soft);color:var(--rev)}
.k-final{background:var(--fin-soft);color:var(--fin)}
.task-t{font-weight:500;overflow-wrap:anywhere}
.task-m{font-size:12.5px;color:var(--ink2)}
.task.done .task-t{text-decoration:line-through;color:var(--ink2)}
.task.done .task-b{opacity:.6}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 13px var(--font-b);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:focus-visible,details>summary:focus-visible,.task input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* fixed lessons table */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink2);font-size:12px;border-top:0}
td:last-child{white-space:normal}

/* details lists */
details.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-inline-end:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);flex:none;transition:transform .15s}
details[open].card>summary::after{transform:rotate(-135deg)}
.sum-l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sum-l strong{font-family:var(--font-d);font-size:16px}
.sum-l span{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.list{padding:0 14px 8px;display:flex;flex-direction:column}
.lrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.lrow .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.lrow.done .ck{background:var(--accent);border-color:var(--accent)}
.lrow.done .task-t{color:var(--ink2)}
.lrow .task-b{gap:2px}
.week-days{padding:0 14px 10px;display:flex;flex-direction:column;gap:6px}
.wd{border-top:1px solid var(--line);padding-top:10px}
.wd h4{margin:0 0 2px;font:700 14px var(--font-d);display:flex;justify-content:space-between;gap:8px}
.wd h4 span{font:500 12px var(--font-b);color:var(--ink2)}
.wd.today h4{color:var(--accent)}
.note{font-size:13px;color:var(--ink2)}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.next-l{display:flex;flex-direction:column;gap:1px}
.next-l strong{font-family:var(--font-d);font-size:16px}
.eta{font:800 15px var(--font-d);color:var(--accent)}
.timer{padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.timer .nav{justify-content:center}
.tm-mode{font:600 13px var(--font-b);color:var(--ink2)}
.tm-time{font:800 56px/1 var(--font-d);font-variant-numeric:tabular-nums;direction:ltr}
.tm-msg{min-height:20px;font-size:13px;color:var(--accent)}
.note-box{width:100%;font:15px/1.6 var(--font-b);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;min-height:100px}
.note-box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.goal{font-size:13px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 22px var(--font-d);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.chip{flex:none;font:600 13px var(--font-b);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip:focus-visible,.gf input:focus-visible,.gf select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.late{border-color:var(--backlog)}
details.late .list .task{border-top:1px solid var(--line)}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.gf input,.gf select{font:15px var(--font-b);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
.gf .wide{grid-column:1/-1}
.gm{padding:0 14px 10px;font-size:13px;color:var(--backlog)}
.grow{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.grow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pct{font:800 16px var(--font-d);font-variant-numeric:tabular-nums}
.gbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px}
.g-ok{color:var(--accent)}.g-mid{color:var(--new)}.g-low{color:var(--backlog)}
.gi-ok{background:var(--accent)}.gi-mid{background:var(--new)}.gi-low{background:var(--backlog)}
.gdel{border:0;background:none;color:var(--ink2);font-size:18px;min-width:40px;min-height:40px;cursor:pointer}
.focus{padding:10px 14px;background:var(--backlog-soft);color:var(--backlog);font-size:13.5px;font-weight:600;border-radius:0 0 12px 12px}
.bk{width:100%;min-height:80px;font:12px/1.4 monospace;direction:ltr;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px}
</style>

.card,.stat{border-radius:18px;box-shadow:var(--shadow)}

function iso(dt){ var m = dt.getMonth()+1, d = dt.getDate(); return dt.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d; }
var now = new Date();
var todayIso = iso(now);

  {d:2,h:14,m:0,l:'علوم',lv:1},{d:3,h:14,m:0,l:'رياضة',lv:1},{d:3,h:15,m:15,l:'عربي',lv:0},{d:4,h:17,m:0,l:'تاريخ',lv:1}];
var DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function hm(h,m){ return h+':'+(m<10?'0':'')+m; }
function nextEvent(){
  var n=new Date(), best=null;
  for (var k=0;k<8;k++){
    var day=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k);
    EVENTS.forEach(function(ev){
      if (ev.d!==day.getDay()) return;
      var at=new Date(day.getFullYear(),day.getMonth(),day.getDate(),ev.h,ev.m);
      if (at>n && (!best||at<best.at)) best={ev:ev,at:at};
    });
  }
  return best;
}
function nextHtml(){
  var b=nextEvent(); if(!b) return '';
  var diff=Math.round((b.at-new Date())/60000), ev=b.ev;
  var when = diff<60 ? diff+' دقيقة' : (diff<1440 ? Math.floor(diff/60)+' ساعة و '+(diff%60)+' دقيقة' : Math.floor(diff/1440)+' يوم');
  var leave='';
  if (ev.lv){ var lm=ev.h*60+ev.m-30; leave='<span class="muted">اتحرك '+hm(Math.floor(lm/60)%12||12,lm%60)+'</span>'; }
  return '<div class="card next" id="nextcard"><div class="next-l"><span class="muted">الحصة الجاية</span><strong>'+ev.l+' · '+DN[b.at.getDay()]+' '+hm(ev.h>12?ev.h-12:ev.h,ev.m)+'</strong>'+leave+'</div><div class="eta">باقي '+when+'</div></div>';
}
function goalHtml(d){
  var tot=0, dn=0;
  d.slots.forEach(function(s){ s.tasks.forEach(function(t){ if(!t.opt){ tot++; if(done[t.id]) dn++; } }); });
  return '<div class="goal">خلصت '+dn+' من '+tot+' مهمة في اليوم ده</div>';
}

/* focus timer */
var TM={mode:'focus',len:25*60,left:25*60,running:false,endAt:0,msg:''};
var PRESETS={f25:['focus',25],r5:['rest',5],f45:['focus',45]};
var wake=null;
function takeWake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){wake=l;}).catch(function(){}); }catch(e){} }
function releaseWake(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
function fmt(s){ s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function timerHtml(){
  return '<section class="sec"><h2>مؤقت التركيز</h2><div class="card timer">'+
   '<div class="tm-mode">'+(TM.mode==='focus'?'تركيز':'راحة')+'</div>'+
   '<div class="tm-time" id="tm">'+fmt(TM.left)+'</div>'+
   '<div class="tm-msg" id="tmmsg">'+esc(TM.msg)+'</div>'+
   '<div class="nav"><button class="btn" id="tstart">'+(TM.running?'وقّف':'ابدأ')+'</button><button class="btn" id="treset">من الأول</button></div>'+
   '<div class="nav"><button class="btn" data-pre="f25">25 تركيز</button><button class="btn" data-pre="r5">5 راحة</button><button class="btn" data-pre="f45">45 تركيز</button></div>'+
   '</div></section>';
}
function updateTimer(){
  if (TM.running){
    TM.left=(TM.endAt-Date.now())/1000;
    if (TM.left<=0){
      TM.running=false; TM.left=0;
      TM.msg = TM.mode==='focus' ? 'خلصت جلسة التركيز. خد راحة 5 دقايق.' : 'الراحة خلصت. ارجع للمذاكرة.';
      try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(e){}
      releaseWake();
      var sb=document.getElementById('tstart'); if(sb) sb.textContent='ابدأ';
      var mm=document.getElementById('tmmsg'); if(mm) mm.textContent=TM.msg;
    }
  }
  var el=document.getElementById('tm'); if(el) el.textContent=fmt(TM.left);
}

/* daily notes */
var NKEY='mostafa-notes-v1', notes={};
try{ notes=JSON.parse(localStorage.getItem(NKEY)||'{}')||{}; }catch(e){ notes={}; }
function notesHtml(date){
  return '<section class="sec"><h2>أسئلة وملاحظات</h2><textarea id="note" class="note-box" rows="4" data-date="'+date+'" placeholder="اكتب أي حاجة مش فاهمها النهاردة، وأسأل عنها في الحصة الجاية">'+esc(notes[date]||'')+'</textarea></section>';
}

function render(){
  var core = allTasks.filter(function(t){ return !t.opt; }); var total = core.length, nd = core.filter(function(t){ return done[t.id]; }).length;
  var examD = new Date(DATA.exam + 'T00:00:00');
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var left = Math.max(0, Math.round((examD - t0) / 86400000));
  var pct = total ? Math.round(nd*100/total) : 0;

  var h = '';
  h += '<header class="head"><div class="head-top"><div><h1>جدول مصطفى</h1><div class="muted">أولى ثانوي · الترم الأول</div></div>'+
       '<div class="count"><b>'+left+'</b>يوم على الامتحان</div></div>'+
       '<div><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
       '<div class="bar-note"><span>خلصت '+nd+' من '+total+' مهمة</span><span>'+pct+'%</span></div></div></header>';

  h += statsHtml() + navHtml() + nextHtml();
  // today
  var d = byDate[shownIso];
  var isToday = shownIso === todayIso;
  var label = isToday ? 'النهاردة' : (todayIso < first ? 'أول يوم في الخطة' : 'آخر يوم');
  h += '<section class="sec" id="sec-today"><div class="card day"><div class="day-h"><h3>'+dateLabel(d)+'</h3><span class="badge">'+label+'</span></div>'+
       goalHtml(d) + fixedHtml(d) + slotsHtml(d) + '</div>'+
       '<div class="nav"><button class="btn" id="prev">اليوم اللي قبله</button><button class="btn" id="next">اليوم اللي بعده</button>'+(isToday?'':'<button class="btn" id="goto">ارجع للنهاردة</button>')+'</div></section>';
  h += lateHtml() + timerHtml() + notesHtml(shownIso);

  // fixed lessons
  h += '<section class="sec"><h2>حصصك الثابتة</h2><div class="card tbl"><table><thead><tr><th>اليوم</th><th>الحصة</th><th>المواصلات</th></tr></thead><tbody>'+
    '<tr><td>السبت</td><td>علوم 12:00 أو 2:00</td><td>اتحرك 11:15 أو 1:30</td></tr>'+
    '<tr><td>الأحد</td><td>رياضة 2:00، عربي 3:15 – 4:30</td><td>اتحرك 1:30، ترجع حوالي 5:00</td></tr>'+
    '<tr><td>الإثنين</td><td>تاريخ 5:00</td><td>اتحرك 4:30</td></tr>'+
    '<tr><td>الثلاثاء</td><td>علوم 2:00</td><td>اتحرك 1:30</td></tr>'+
    '<tr><td>الأربعاء</td><td>رياضة 2:00، عربي 3:15 – 4:30</td><td>اتحرك 1:30، ترجع حوالي 5:00</td></tr>'+
    '<tr><td>الخميس</td><td>تاريخ 5:00</td><td>اتحرك 4:30</td></tr>'+
    '</tbody></table></div><div class="note">الصبح من 8:00 لـ 11:00 للمتراكم، وبعد الحصة تذاكر اللي اتشرح، وآخر اليوم ساعة إنجليزي. الجمعة يوم راحة خفيف. النوم 8 بالليل.</div></section>';

  h += gradesHtml();
  // subjects
  h += '<section class="sec" id="sec-subj"><h2>المواد <small>اضغط على المادة تشوف دروسها</small></h2>';
  Object.keys(DATA.lessons).forEach(function(s){
    var L = DATA.lessons[s];
    var bl = L.filter(function(l){ return l.status==='backlog'; }), nw = L.filter(function(l){ return l.status==='new'; });
    var cnt = function(a){ return a.filter(function(l){ return done[lessonTask[l.id]]; }).length; };
    h += '<details class="card"><summary><span class="sum-l"><strong><span class="subj s-'+s+'" style="font-size:16px;font-family:var(--font-d)">'+DATA.subj[s]+'</span></strong>'+
         '<span>متراكم '+cnt(bl)+' من '+bl.length+' · جديد '+cnt(nw)+' من '+nw.length+'</span></span></summary><div class="list">';
    L.forEach(function(l){
      var dn = done[lessonTask[l.id]];
      var dd = byDate[l.date];
      h += '<div class="lrow'+(dn?' done':'')+'"><span class="ck">'+(dn?'✓':'')+'</span><span class="task-b"><span class="task-l"><span class="tag k-'+l.status+'">'+KIND[l.status]+'</span></span>'+
           '<span class="task-t" dir="auto">'+esc(l.title)+'</span><span class="task-m">'+esc(l.meta)+' · '+dateLabel(dd)+'</span></span></div>';
    });
    h += '</div></details>';
  });
  h += '</section>';

  // calendar by week
  var weeks = [], cur = null;
  DAYS.forEach(function(x){
    var dt = new Date(x.date + 'T00:00:00');
    var back = (dt.getDay() + 1) % 7;
    var ws = new Date(dt); ws.setDate(dt.getDate() - back);
    var k = iso(ws);
    if (!cur || cur.k !== k){ cur = {k:k, days:[]}; weeks.push(cur); }
    cur.days.push(x);
  });
  h += '<section class="sec" id="sec-days"><h2>كل الأيام <small>من 2 نوفمبر لـ 8 يناير</small></h2>';
  weeks.forEach(function(w){
    var a = w.days[0], b = w.days[w.days.length-1];
    var open = w.days.some(function(x){ return x.date === shownIso; });
    var wt = w.days.reduce(function(n,x){ return n + x.slots.reduce(function(m,s){ return m + s.tasks.filter(function(t){ return !t.opt; }).length; },0); },0);
    var wdn = w.days.reduce(function(n,x){ return n + x.slots.reduce(function(m,s){ return m + s.tasks.filter(function(t){ return !t.opt && done[t.id]; }).length; },0); },0);
    var title = a.dnum + ' ' + a.mon + ' إلى ' + b.dnum + ' ' + b.mon;
    h += '<details class="card"'+(open?' open':'')+'><summary><span class="sum-l"><strong>'+title+'</strong><span>'+wdn+' من '+wt+' مهمة'+(a.phase==='final'?' · مراجعة نهائية':'')+'</span></span></summary><div class="week-days">';
    w.days.forEach(function(x){
      h += '<div class="wd'+(x.date===todayIso?' today':'')+'"><h4>'+dateLabel(x)+(x.date===todayIso?'<span>النهاردة</span>':'')+'</h4>'+slotsHtml(x)+'</div>';
    });
    h += '</div></details>';
  });
  h += '</section>';

  h += backupHtml();
  var app = document.getElementById('app');
  // keep open state of details across re-render
  var openIdx = []; app.querySelectorAll('details').forEach(function(el,i){ if (el.open) openIdx.push(i); });
  var hadDetails = app.querySelectorAll('details').length > 0;
  app.innerHTML = h;
  if (hadDetails) app.querySelectorAll('details').forEach(function(el,i){ el.open = openIdx.indexOf(i) >= 0; });
}

document.addEventListener('change', function(e){
  var id = e.target && e.target.getAttribute && e.target.getAttribute('data-task');
  if (!id) return;
  if (e.target.checked) done[id] = true; else delete done[id];
  save(); render();
});
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.id) return;
  var idx = DAYS.findIndex(function(x){ return x.date === shownIso; });
  if (t.id === 'prev' && idx > 0){ shownIso = DAYS[idx-1].date; render(); }
  else if (t.id === 'next' && idx < DAYS.length-1){ shownIso = DAYS[idx+1].date; render(); }
  else if (t.id === 'goto'){ shownIso = todayIso < first ? first : (todayIso > last ? last : todayIso); render(); }
});
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('button') : null;
  if (!t) return;
  var pre = t.getAttribute('data-pre');
  if (pre){ var p=PRESETS[pre]; TM.mode=p[0]; TM.len=p[1]*60; TM.left=TM.len; TM.running=false; TM.msg=''; releaseWake(); render(); }
  else if (t.id==='tstart'){
    if (TM.running){ TM.running=false; TM.left=(TM.endAt-Date.now())/1000; releaseWake(); }
    else { if (TM.left<=0) TM.left=TM.len; TM.endAt=Date.now()+TM.left*1000; TM.running=true; TM.msg=''; takeWake(); }
    render();
  }
  else if (t.id==='treset'){ TM.running=false; TM.left=TM.len; TM.msg=''; releaseWake(); render(); }
});
document.addEventListener('input', function(e){
  var t=e.target;
  if (t && t.id==='note'){
    notes[t.getAttribute('data-date')]=t.value;
    try{ localStorage.setItem(NKEY, JSON.stringify(notes)); }catch(x){}
  }
});
/* grades */
var GKEY='mostafa-grades-v1', grades=[], gf={subj:'math',name:'',score:'',max:'',msg:''};
try{ grades=JSON.parse(localStorage.getItem(GKEY)||'[]')||[]; }catch(e){ grades=[]; }
function gsave(){ try{ localStorage.setItem(GKEY, JSON.stringify(grades)); }catch(e){} }
function num(v){ v=String(v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace('٫','.').replace(',','.'); return parseFloat(v); }
function gstats(){
  var r={}, all=[0,0];
  Object.keys(DATA.subj).forEach(function(s){
    var sc=0,mx=0,n=0; grades.forEach(function(g){ if(g.subj===s){ sc+=g.score; mx+=g.max; n++; } });
    r[s]={n:n,pct:mx?Math.round(sc*100/mx):null}; all[0]+=sc; all[1]+=mx;
  });
  r._avg = all[1] ? Math.round(all[0]*100/all[1]) : null;
  return r;
}
function gcls(p){ return p>=85?'ok':(p>=65?'mid':'low'); }
function gradesHtml(){
  var st=gstats(), h='<section class="sec" id="sec-grades"><h2>درجاتي <small>سجّل كل اختبار أو واجب</small></h2><div class="card">';
  var opts=Object.keys(DATA.subj).map(function(s){ return '<option value="'+s+'"'+(gf.subj===s?' selected':'')+'>'+DATA.subj[s]+'</option>'; }).join('');
  h+='<div class="gf"><select id="g-subj" class="wide" aria-label="المادة">'+opts+'</select>'+
     '<input id="g-name" class="wide" placeholder="اسم الاختبار (مثلًا: اختبار بلاغة 1)" value="'+esc(gf.name)+'">'+
     '<input id="g-score" inputmode="decimal" placeholder="درجتك" value="'+esc(gf.score)+'">'+
     '<input id="g-max" inputmode="decimal" placeholder="من كام" value="'+esc(gf.max)+'">'+
     '<button class="btn wide" id="g-add">أضف الدرجة</button></div>'+(gf.msg?'<div class="gm">'+esc(gf.msg)+'</div>':'');
  var weak=null;
  Object.keys(DATA.subj).forEach(function(s){
    var x=st[s]; if(x.pct===null) return;
    h+='<div class="grow"><div class="grow-h"><span class="subj s-'+s+'">'+DATA.subj[s]+'</span><span class="task-m">'+x.n+' اختبار</span><span class="pct g-'+gcls(x.pct)+'">'+x.pct+'%</span></div>'+
       '<div class="gbar"><i class="gi-'+gcls(x.pct)+'" style="width:'+x.pct+'%"></i></div></div>';
    if(!weak||x.pct<st[weak].pct) weak=s;
  });
  if(!weak) h+='<div class="grow task-m">لسه مفيش درجات. أول ما تضيف أول درجة هيظهر لك متوسط كل مادة.</div>';
  else if(st[weak].pct<85) h+='<div class="focus">ركّز الأسبوع الجاي على '+DATA.subj[weak]+' (متوسطك '+st[weak].pct+'%)</div>';
  var recent=grades.slice(-6).reverse();
  recent.forEach(function(g){
    h+='<div class="grow"><div class="grow-h"><span class="task-t" dir="auto">'+esc(g.name||'بدون اسم')+'</span><span class="pct g-'+gcls(Math.round(g.score*100/g.max))+'">'+g.score+'/'+g.max+'</span><button class="gdel" data-gdel="'+g.id+'" aria-label="احذف">×</button></div><span class="task-m">'+DATA.subj[g.subj]+' · '+g.date+'</span></div>';
  });
  return h+'</div></section>';
}
/* late tasks, stats, nav */
function lateList(){
  var out=[]; DAYS.forEach(function(d){ if(d.date<todayIso) d.slots.forEach(function(s){ s.tasks.forEach(function(t){ if(!t.opt && !done[t.id]) out.push({d:d,t:t}); }); }); });
  return out;
}
function lateHtml(){
  var L=lateList(); if(!L.length) return '';
  return '<details class="card late"><summary><span class="sum-l"><strong>اللي فاتك ('+L.length+')</strong><span>علّم اللي خلصته فعلًا، والباقي كمّله في أول فرصة</span></span></summary><div class="list">'+
    L.map(function(x){ return taskHtml(x.t)+'<div class="task-m" style="padding-inline-start:32px;margin-top:-8px">'+dateLabel(x.d)+'</div>'; }).join('')+'</div></details>';
}
function statsHtml(){
  var st=gstats(), d=byDate[todayIso], tot=0, dn=0;
  if(d) d.slots.forEach(function(s){ s.tasks.forEach(function(t){ if(!t.opt){ tot++; if(done[t.id]) dn++; } }); });
  return '<div class="stats"><div class="stat"><b>'+(st._avg===null?'—':st._avg+'%')+'</b><span>متوسط درجاتك</span></div>'+
    '<div class="stat"><b>'+lateList().length+'</b><span>مهمة متأخرة</span></div>'+
    '<div class="stat"><b>'+(d?dn+'/'+tot:'—')+'</b><span>مهام النهاردة</span></div></div>';
}
function navHtml(){
  return '<div class="chips"><button class="chip" data-go="sec-today">اليوم</button><button class="chip" data-go="sec-grades">درجاتي</button><button class="chip" data-go="sec-subj">المواد</button><button class="chip" data-go="sec-days">كل الأيام</button><button class="chip" data-go="sec-bk">نسخة احتياطية</button></div>';
}
function backupHtml(){
  return '<section class="sec" id="sec-bk"><h2>نسخة احتياطية <small>عشان متضيعش تقدمك</small></h2><textarea id="bk" class="bk" placeholder="اضغط (انسخ تقدمي) وخزّن الكود، وللاسترجاع الصقه هنا واضغط (استرجع)"></textarea><div class="nav"><button class="btn" id="bkexp">انسخ تقدمي</button><button class="btn" id="bkimp">استرجع</button></div></section>';
}
document.addEventListener('input', function(e){
  var t=e.target; if(!t||!t.id) return;
  if(t.id==='g-name') gf.name=t.value; else if(t.id==='g-score') gf.score=t.value; else if(t.id==='g-max') gf.max=t.value; else if(t.id==='g-subj') gf.subj=t.value;
});
document.addEventListener('click', function(e){
  var t=e.target&&e.target.closest?e.target.closest('button'):null; if(!t) return;
  var go=t.getAttribute('data-go');
  if(go){ var el=document.getElementById(go); if(el){ var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'}); } return; }
  var gd=t.getAttribute('data-gdel');
  if(gd){ if(!confirm('تحذف الدرجة دي؟')) return; grades=grades.filter(function(g){ return String(g.id)!==gd; }); gsave(); render(); return; }
  if(t.id==='g-add'){
    var sc=num(gf.score), mx=num(gf.max);
    if(!(mx>0) || !(sc>=0)){ gf.msg='اكتب الدرجة وإجمالي الدرجات بالأرقام.'; render(); return; }
    if(sc>mx){ gf.msg='الدرجة أكبر من الإجمالي، راجع الأرقام.'; render(); return; }
    grades.push({id:Date.now(),subj:gf.subj,name:gf.name.trim(),score:sc,max:mx,date:todayIso});
    gsave(); gf.name='';gf.score='';gf.max='';gf.msg=''; render(); return;
  }
  if(t.id==='bkexp'){ var b=document.getElementById('bk'); b.value=JSON.stringify({done:done,notes:notes,grades:grades}); b.select(); try{ document.execCommand('copy'); }catch(x){} return; }
  if(t.id==='bkimp'){
    var v=document.getElementById('bk').value;
    try{ var o=JSON.parse(v); if(!confirm('الاسترجاع هيستبدل تقدمك ودرجاتك وملاحظاتك الحالية بالنسخة اللي لصقتها. تكمّل؟')) return; try{ localStorage.setItem('mostafa-pre-restore-v1', JSON.stringify({at:new Date().toISOString(),done:done,notes:notes,grades:grades})); }catch(z){} if(o.done) done=o.done; if(o.notes) notes=o.notes; if(o.grades) grades=o.grades;
      save(); gsave(); try{ localStorage.setItem(NKEY, JSON.stringify(notes)); }catch(x){} render(); }
    catch(x){ document.getElementById('bk').value='الكود مش مظبوط، انسخه كامل وجرّب تاني.'; }
  }
});

setInterval(function(){
  var n=new Date(), i=iso(n);
  if(i===todayIso) return;
  var wasToday=(shownIso===todayIso);
  now=n; todayIso=i;
  if(wasToday){
    shownIso = todayIso < first ? first : (todayIso > last ? last : todayIso);
    if(!byDate[shownIso]){ for(var k=0;k<DAYS.length;k++){ if(DAYS[k].date>=shownIso){ shownIso=DAYS[k].date; break; } } }
  }
  render();
}, 60000);
setInterval(updateTimer, 500);
setInterval(function(){
  var el=document.getElementById('nextcard'); if(!el) return;
  var tmp=document.createElement('div'); tmp.innerHTML=nextHtml();
  if (tmp.firstChild) el.replaceWith(tmp.firstChild);
}, 30000);
render();
</script>

</body></html>
